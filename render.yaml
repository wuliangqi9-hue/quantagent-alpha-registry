services:
  - type: web
    name: quantagent-alpha-registry
    env: docker
    plan: free
    envVars:
      - key: MANTLE_RPC_URL
        value: https://rpc.mantle.xyz
      - key: MANTLE_CHAIN_ID
        value: "5000"
      - key: MANTLE_EXPLORER_BASE
        value: https://explorer.mantle.xyz
      - key: MANTLE_ENABLE_ONCHAIN_WRITES
        value: "false"
